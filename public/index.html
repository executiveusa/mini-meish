/* ═══════════════════════════════════════════════════════════════════
   API — Cloudflare Worker / D1 with localStorage fallback
═══════════════════════════════════════════════════════════════════ */
const IS_FILE = window.location.protocol === 'file:';
const API_BASE = IS_FILE ? null : '';

function lsGet(k,d){try{const v=localStorage.getItem('mm_'+k);return v?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem('mm_'+k,JSON.stringify(v))}catch{}}

async function apiGet(path){
  if(!API_BASE && API_BASE!=='') return null;
  try{const r=await fetch(API_BASE+path);if(!r.ok)return null;return await r.json()}catch{return null}
}
async function apiPost(path,body){
  if(!API_BASE && API_BASE!=='') return null;
  try{const r=await fetch(API_BASE+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)return null;return await r.json()}catch{return null}
}
async function apiDel(path){
  if(!API_BASE && API_BASE!=='') return null;
  try{const r=await fetch(API_BASE+path,{method:'DELETE'});return await r.json()}catch{return null}
}

const REPORT=[
  {id:"r1",icon:"\u{1F4CB}",title:"What Is Happening",body:"You co-signed a $575,000 bail bond for Jovontae Marquelle Hill through Bail Hotline Bail Bonds (agent: Kazuyoshi Kubota), backed by Financial Casualty & Surety, Inc.\n\nThe bond was signed on September 26, 2025.\n\nAccording to an email from Lori Valdes, Investigator at Bail Hotline (sent January 21 at 1:57 PM), Jovontae failed to appear in San Diego County Superior Court on November 26, 2025. A warrant has been issued for his arrest.\n\nAs a result, Bail Hotline is asserting that you are now liable for the full $575,000 bond.\n\nThe email states: \"If this situation isn't addressed immediately, our Legal Department is prepared to move forward with collections, including potential wage garnishment, which could have a direct and lasting impact on your credit and financial standing.\"\n\nThe bond covers five cases across four counties:\n\n\u2022 Orange County \u2014 Case 20HF0615 \u2014 $200,000 \u2014 Charge: PC 29800(A)(1)\n\u2022 Orange County \u2014 (no case number on document) \u2014 $25,000 \u2014 Charges: HS 11377(a), VC 14601.1(A)\n\u2022 San Diego \u2014 (no case number in documents) \u2014 $50,000 \u2014 Charge: VC 2000.2(A)\n\u2022 San Diego \u2014 (no case number in documents) \u2014 $50,000 \u2014 Charge: VC 23152(a)\n\u2022 San Bernardino \u2014 Case FVI19002680 \u2014 $250,000 \u2014 Charges: VC 23152(a), VC 23152(b)\n\nTotal: $575,000"},
  {id:"r2",icon:"\u{1F4C4}",title:"What Your Signed Contract Says You Owe",body:"The Surety Bail Bond Agreement (FCS-110-CA) you signed with Bail Hotline Bail Bonds states the following obligations. These are direct quotes from your signed contract:\n\nFIRST: \"To pay Second Party $57,500.00 for this Bail Bond. The premium is fully earned upon the release of Principal.\"\n\nTHIRD: \"To reimburse Second Party and Surety for actual expenses incurred and caused by a breach by the Principal... including all expenses or liabilities incurred as a result of searching for, recapturing or returning Principal to custody... including legal fees incurred by Second Party or Surety in making application to a court for an order to vacate or to set aside the order of forfeiture or Summary Judgment entered thereon.\"\n\nFOURTH: \"To pay Second Party or Surety, in the event that it is necessary for them to institute a suit or collection, for a breach of this agreement, a reasonable attorney's fee or collection fees which shall, in no event, be less than the sum of twenty-five dollars ($25.00).\"\n\nSIXTH: \"To pay to the Second Party or the Surety immediately upon the declaration of forfeiture of said Bail Bond the penal amount thereof.\"\n\nItem 6 of the Indemnitor/Guarantor Checklist: \"I understand that if it becomes necessary to arrest and surrender the defendant, I am responsible for paying for investigation, location and apprehension time: this is billed at a minimum rate of $250 per hour per investigator plus expenses.\"\n\nItem 7: \"I understand that if the bail is ordered forfeited by the court, I am responsible to pay court costs and reasonable appearance fees (a minimum of $50) for the bail agency to reinstate or exonerate the bail bond if necessary.\"\n\nItem 15 (Venue Clause): \"I agree that if legal action between the parties concerning this bail bond is brought, it shall be brought in and before a federal or state court in Riverside County in the State of California.\"\n\nThe Satisfaction of Full Premium document lists:\n\u2022 Bail Amount: $575,000.00\n\u2022 Indemnitor: Meishael Smith\n\u2022 Email: MEISHAEL@YAHOO.COM\n\u2022 Phone: (407) 883-9277"},
  {id:"r3",icon:"\u2696\uFE0F",title:"What Must Legally Happen Before You Owe $575,000",body:"This is the most important section. The bail company's demand does not automatically mean you owe $575,000 today. California law requires specific steps before the full bond amount can be enforced against you.\n\nHere is the procedural sequence under California Penal Code 1305-1306:\n\nStep 1 \u2014 Forfeiture Declaration\nThe court must formally declare the bond forfeited when the defendant fails to appear. This happens in open court and is entered in the minutes.\n\nStep 2 \u2014 Notice of Forfeiture Mailed\nAfter forfeiture is declared, the court clerk must mail a Notice of Forfeiture to the bail company (the surety) and the bail agent. The mailing date is critical \u2014 it starts the clock.\n\nStep 3 \u2014 The Appearance Period (185 Days)\nFrom the date the Notice of Forfeiture is mailed, there is typically a 180-day period (extended to 185 days with mailing time) during which the surety can move to have the forfeiture set aside \u2014 for example, if the defendant appears in court, is arrested, dies, or is deported.\n\nStep 4 \u2014 Summary Judgment\nIf the appearance period expires without resolution, the court may enter Summary Judgment against the surety for the full bond amount. Only after Summary Judgment does the surety's liability become a court judgment.\n\nStep 5 \u2014 Collection Against You as Indemnitor\nAfter Summary Judgment, the surety can seek to collect from you as the indemnitor. This is when wage garnishment or property liens become a real legal possibility.\n\nWhat this means for you right now:\nYou need to find out exactly where each bond is in this sequence. The bail company's email uses urgent language \u2014 but until you verify the court records, you do not know whether Summary Judgment has been entered, whether the appearance period is still open, or whether any procedural defects exist that could benefit you.\n\nDo not assume the worst. Do not assume the best. Verify."},
  {id:"r4",icon:"\u{1F6A6}",title:"Immediate Do / Don\u2019t",body:"DO:\n\n\u2022 Keep all communication in writing or follow up calls with an email summary.\n\u2022 Request official, certified copies of every court notice and judgment.\n\u2022 Log every call \u2014 who you spoke with, what was said, date, and time.\n\u2022 Ask each court for the forfeiture date, notice mailed date, and summary judgment status.\n\u2022 Get everything in writing before making any payment.\n\u2022 Check the Bond Timeline page after every court call and fill in what you learned.\n\nDON\u2019T:\n\n\u2022 Do not transfer property or assets into another person's name or into a trust right now. This can appear fraudulent and may not protect you.\n\u2022 Do not sign any new payment agreements with the bail company without first understanding the court status and consulting an attorney.\n\u2022 Do not admit liability in writing or over the phone.\n\u2022 Do not share detailed information about your assets or finances with the bail company investigator.\n\u2022 Do not panic at the language in the email. \"Legal Department is prepared to move forward with collections\" is a pressure statement. Actual collection requires court action."},
  {id:"r5",icon:"\u{1F4DE}",title:"Your Calls: What to Ask Each Court",body:"Call each court and ask these four questions. You are not explaining your situation. You are collecting procedural facts.\n\nThe four questions:\n1) Was forfeiture declared on the bond? On what date?\n2) When was the Notice of Forfeiture mailed?\n3) Has summary judgment been entered on the bond? If so, on what date?\n4) How can I obtain certified copies of the Notice of Forfeiture and the minute order?\n\nSan Diego Superior Court \u2014 Bail/Forfeiture Unit\n\u2022 Main Clerk: (619) 844-2000\n\u2022 Bail/Forfeiture Unit: (619) 844-2161 (verify this number)\n\u2022 Website: sdcourt.ca.gov\n\u2022 Note: Two bonds exist in San Diego. Case numbers are not in your documents \u2014 the clerk can look up by defendant name.\n\nRiverside Superior Court \u2014 Civil Filings\n\u2022 Phone: (760) 274-9790 (verify division)\n\u2022 Website: riverside.courts.ca.gov\n\u2022 What to ask: Has any civil lawsuit been filed under my name related to a bail bond indemnity matter? Defendant: Jovontae Marquelle Hill. If so, provide case number and filing date.\n\u2022 Why Riverside: The venue clause in your contract states all legal action must be filed in Riverside County.\n\nOrange County Superior Court \u2014 Bond/Forfeiture Clerk\n\u2022 Find the phone number at: occourts.org\n\u2022 Case number: 20HF0615\n\nSan Bernardino Superior Court \u2014 Bond/Forfeiture Clerk\n\u2022 Find the phone number at: sb-court.org\n\u2022 Case number: FVI19002680\n\nAfter each call:\n\u2022 Log who you spoke with, what was confirmed, and what was not confirmed.\n\u2022 Enter the dates you find into the Bond Timeline tab immediately.\n\u2022 If they ask you to submit a written request, use the document request template in the Tasks section.\n\u2022 If they cannot locate the case by name, have the defendant's date of birth ready: 09/27/1992."},
  {id:"r6",icon:"\u{1F4C1}",title:"Documents to Request and Track",body:"You need to collect and store the following documents. This is your evidence.\n\nFrom each court:\n\u2022 Notice of Forfeiture \u2014 the official notice mailed to the bail company, with the mailing date visible\n\u2022 Minute order \u2014 the court's record of the FTA (Failure to Appear) and the forfeiture declaration\n\u2022 Summary Judgment entry \u2014 if one has been entered, this is the court's final judgment on the bond\n\u2022 Any extension or motion to vacate that has been filed\n\nDocuments you already have (from the bond packet):\n\u2022 Application and Agreement for Surety Bail Bond (FCS-106-CA) \u2014 signed 09/26/2025\n\u2022 Surety Bail Bond Agreement (FCS-110-CA) \u2014 signed 09/26/2025\n\u2022 Indemnitor/Guarantor Checklist (FCS-125) \u2014 signed 09/26/2025\n\u2022 Conditions of Release \u2014 signed 09/26/2025\n\u2022 Plain Talk Contract \u2014 signed 09/26/2025\n\u2022 Satisfaction of Full Premium \u2014 signed 09/26/2025\n\u2022 Supervised Bail Agreement \u2014 signed 09/26/2025\n\u2022 Bond Disclosure Statement (FCS-165-CA)\n\u2022 Email from Lori Valdes, dated January 21, re: active warrant and $575K claim\n\nDocument Request Template:\nSubject: Request for Bond Forfeiture Documents\n\nDear Clerk,\n\nI am requesting certified copies of:\n\u2022 Notice of Forfeiture and mailing date\n\u2022 Summary Judgment entry (if any)\n\u2022 Corresponding case number(s)\n\nDefendant: Jovontae Marquelle Hill\nDate of Birth: 09/27/1992\n\nPlease advise how to obtain copies and associated fees.\n\nThank you,\n[Your Name]"},
  {id:"r7",icon:"\u{1F3E0}",title:"The Venue Clause and Arizona Property Risk",body:"The venue clause in your contract is important.\n\nItem 15 of the Indemnitor/Guarantor Checklist states:\n\"Agreement of Venue: I agree that if legal action between the parties concerning this bail bond is brought, it shall be brought in and before a federal or state court in Riverside County in the State of California.\"\n\nThe Satisfaction of Full Premium document also states:\n\"Any litigation arising out of this bail bond(s) shall take place in Riverside, California.\"\n\nWhat this means: If Bail Hotline or the surety sues you, they will most likely file in Riverside County, California. This is why you are calling Riverside Superior Court to check for civil filings \u2014 that is where a lawsuit would appear first.\n\nRegarding your Arizona property:\nYou own real property in Maricopa, Arizona (address listed on your bond application: 37125 W Prado St, Maricopa AZ 85138).\n\nIf a California civil judgment is entered against you, it can be \"domesticated\" in Arizona \u2014 meaning it can be registered with an Arizona court and enforced there. This could result in a lien on your property.\n\nThis does not happen automatically or immediately. It requires:\n1) A California court judgment (Summary Judgment on the bond)\n2) A legal action to domesticate the judgment in Arizona\n3) Arizona court proceedings\n\nRules for now:\n\u2022 Do not transfer the property into another name or trust before speaking with an Arizona attorney.\n\u2022 Do not encumber the property with new liens or mortgages.\n\u2022 If you are served with any legal papers, respond within the deadlines stated on the papers.\n\u2022 An Arizona attorney can advise you on homestead exemptions that may apply to your primary residence."},
  {id:"r8",icon:"\u{1F4B0}",title:"Financial Tracking and Negotiation",body:"Known financial figures from your documents:\n\nBond amounts by case:\n\u2022 Orange County, Case 20HF0615: $200,000\n\u2022 Orange County (second case): $25,000\n\u2022 San Diego (first bond): $50,000\n\u2022 San Diego (second bond): $50,000\n\u2022 San Bernardino, Case FVI19002680: $250,000\n\u2022 Total: $575,000\n\nPremium paid:\n\u2022 $19,515 \u2014 listed on Indemnitor/Guarantor Checklist and Plain Talk Contract, dated 09/26/2025\n\u2022 This is fully earned and non-refundable once the defendant was released from custody.\n\nAmount shown on Surety Bail Bond Agreement:\n\u2022 $57,500 \u2014 listed as \"To pay Second Party.\" This appears to be the 10% premium calculation on $575,000. Requires clarification from bail agency.\n\nWhat Bail Hotline is claiming:\n\u2022 Full $575,000 bond amount (per Lori Valdes email, January 21)\n\nWhat you should track going forward:\n\u2022 Any settlement offer from Bail Hotline \u2014 log the amount, date, and who made the offer\n\u2022 Any payment demands in writing \u2014 log and do not sign without review\n\u2022 Any investigation costs billed to you \u2014 the contract allows $250/hour per investigator plus expenses, but this only applies after forfeiture\n\nRule: Do not agree to any payment plan or settlement without first knowing the Summary Judgment status and consulting with a California bail forfeiture attorney. A settlement may be possible, but the terms matter enormously."},
  {id:"r9",icon:"\u{1F454}",title:"Lawyer Outreach: What Kind and What to Say",body:"You may need two types of attorneys depending on what the courts tell you.\n\n1) California bail forfeiture attorney (most urgent if SJ has not been entered)\n\nWhat to look for:\n\u2022 Experience specifically with California Penal Code 1305-1306\n\u2022 Motion practice on bail forfeiture timelines and notice defects\n\u2022 Experience in Orange County, San Diego, and/or San Bernardino courts\n\nWhat to say:\n\"I need a procedural audit of bail forfeiture timelines on a $575,000 bond package across multiple California counties \u2014 Orange County, San Diego, and San Bernardino. I need to know if the Notice of Forfeiture was properly mailed, whether summary judgment has been entered, and whether there are any procedural defects. I am looking for a flat-fee consultation if possible.\"\n\nWhat to ask:\n\u2022 Do you handle PC 1305-1306 bail forfeiture defense?\n\u2022 What is your experience with notice timing defects?\n\u2022 Do you offer a flat-fee procedural audit?\n\u2022 Can you cover multiple counties in one engagement?\n\nImportant: Do not hire anyone based only on a phone call. Get a written scope and fee agreement.\n\n2) Arizona attorney (only if a California judgment is confirmed)\n\nWhat to ask:\n\u2022 Can you advise on domesticating a California judgment in Arizona?\n\u2022 What are my homestead exemption rights on my primary residence?\n\u2022 What is my lien exposure on the property at 37125 W Prado St, Maricopa AZ 85138?\n\u2022 What are my options if a lien is placed?\n\nImportant: Log every attorney in the Attorney Tracker tab. Do not hire anyone without a written scope and fee agreement."},

const fmt=n=>"$"+Number(n).toLocaleString();
function addDays(ds,d){if(!ds)return null;const dt=new Date(ds+'T12:00:00');dt.setDate(dt.getDate()+d);return dt}
function daysUntil(d){if(!d)return null;const n=new Date();n.setHours(0,0,0,0);const t=new Date(d);t.setHours(0,0,0,0);return Math.round((t-n)/864e5)}
function fmtDate(d){if(!d)return'\u2014';const dt=typeof d==='string'?new Date(d+(d.includes('T')?'':'T12:00:00')):d;return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}

═══════════════════════════════════════════════════════════════════ */
function App(){
  const[page,setPage]=useState("dash");
  const[menuOpen,setMenuOpen]=useState(false);
  const[loading,setLoading]=useState(true);
  const[syncing,setSyncing]=useState(false);
  const[lastSync,setLastSync]=useState(null);
  const[useD1,setUseD1]=useState(false);

  const[tasks,setTasksRaw]=useState(TASKS_DEF.map(t=>({...t,done:false})));
  const[taskChecks,setTaskChecksRaw]=useState({});
  const[contacts,setContactsRaw]=useState(CONTACT_DEFS);
  const[bondFacts,setBondFactsRaw]=useState({});
  const[logs,setLogs]=useState([]);
  const[ledger,setLedger]=useState(LEDGER_SEED);
  const[attorneys,setAttorneys]=useState([]);
  const[reportSec,setReportSec]=useState(null);

  const syncTimer=useRef(null);

  // ── LOAD ────────────────────────────────────────────────────────
  useEffect(()=>{
    (async()=>{
      setLoading(true);
      // Try D1 first
      const stateData=await apiGet('/api/state');
      if(stateData && typeof stateData==='object' && !stateData.error){
        setUseD1(true);
        if(stateData.tasks) setTasksRaw(stateData.tasks);
        if(stateData.taskChecks) setTaskChecksRaw(stateData.taskChecks);
        if(stateData.contacts) setContactsRaw(stateData.contacts);
        if(stateData.bondFacts) setBondFactsRaw(stateData.bondFacts);
        const logsData=await apiGet('/api/logs');
        if(logsData) setLogs(logsData);
        const ledgerData=await apiGet('/api/ledger');
        if(ledgerData&&ledgerData.length>0) setLedger(ledgerData);
        else{for(const e of LEDGER_SEED) await apiPost('/api/ledger',e);const f=await apiGet('/api/ledger');if(f&&f.length>0)setLedger(f)}
        const attData=await apiGet('/api/attorneys');
        if(attData) setAttorneys(attData);
        setLastSync(new Date());
      } else {
        // Fallback to localStorage
        setUseD1(false);
        const ls=lsGet('state',{});
        if(ls.tasks) setTasksRaw(ls.tasks);
        if(ls.taskChecks) setTaskChecksRaw(ls.taskChecks);
        if(ls.contacts) setContactsRaw(ls.contacts);
        if(ls.bondFacts) setBondFactsRaw(ls.bondFacts);
        setLogs(lsGet('logs',[]));
        setLedger(lsGet('ledger',LEDGER_SEED));
        setAttorneys(lsGet('attorneys',[]));
        setLastSync(new Date());
      }
      setLoading(false);
    })();
  },[]);

  // ── SAVE STATE (debounced) ──────────────────────────────────────
  const saveState=useCallback((patch)=>{
    setSyncing(true);
    if(syncTimer.current) clearTimeout(syncTimer.current);
    syncTimer.current=setTimeout(async()=>{
      if(useD1){
        await apiPost('/api/state',patch);
      } else {
        const cur=lsGet('state',{});
        lsSet('state',{...cur,...patch});
      }
      setLastSync(new Date());
      setSyncing(false);
    },600);
  },[useD1]);

  const setTasks=u=>{setTasksRaw(p=>{const n=typeof u==='function'?u(p):u;saveState({tasks:n});return n})};
  const setTaskChecks=u=>{setTaskChecksRaw(p=>{const n=typeof u==='function'?u(p):u;saveState({taskChecks:n});return n})};
  const setContacts=u=>{setContactsRaw(p=>{const n=typeof u==='function'?u(p):u;saveState({contacts:n});return n})};
  const setBondFacts=u=>{setBondFactsRaw(p=>{const n=typeof u==='function'?u(p):u;saveState({bondFacts:n});return n})};

  const addLog=async(entry)=>{
    const id=String(Date.now());
    const full={id,at:new Date().toISOString(),...entry};
    if(useD1) await apiPost('/api/logs',full);
    setLogs(p=>{const n=[full,...p];if(!useD1)lsSet('logs',n);return n});
  };
  const delLog=async(id)=>{
    if(useD1) await apiDel('/api/logs/'+id);
    setLogs(p=>{const n=p.filter(l=>l.id!==id);if(!useD1)lsSet('logs',n);return n});
  };
  const addLedger=async(entry)=>{
    const id=String(Date.now());
    const full={id,...entry};
    if(useD1){await apiPost('/api/ledger',full);const f=await apiGet('/api/ledger');if(f)setLedger(f)}
    else setLedger(p=>{const n=[...p,full];lsSet('ledger',n);return n});
  };
  const delLedger=async(id)=>{
    if(useD1) await apiDel('/api/ledger/'+id);
    setLedger(p=>{const n=p.filter(l=>l.id!==id);if(!useD1)lsSet('ledger',n);return n});
  };
  const saveAttorney=async(att)=>{
    if(useD1){await apiPost('/api/attorneys',att);const f=await apiGet('/api/attorneys');if(f)setAttorneys(f)}
    else setAttorneys(p=>{const existing=p.findIndex(a=>a.id===att.id);const n=existing>=0?p.map(a=>a.id===att.id?att:a):[att,...p];lsSet('attorneys',n);return n});
  };
  const delAttorney=async(id)=>{
    if(useD1) await apiDel('/api/attorneys/'+id);
    setAttorneys(p=>{const n=p.filter(a=>a.id!==id);if(!useD1)lsSet('attorneys',n);return n});
  };

  const toggleTask=id=>setTasks(p=>p.map(t=>t.id===id?{...t,done:!t.done}:t));
  const toggleCheck=(tid,i)=>{
    const base=TASKS_DEF.find(t=>t.id===tid);
    const curr=taskChecks[tid]||(base?base.checklist.map(()=>false):[]);
    setTaskChecks(p=>({...p,[tid]:curr.map((v,j)=>j===i?!v:v)}));
  };

  const p0open=tasks.filter(t=>t.p==="P0"&&!t.done);
  const donePct=Math.round((tasks.filter(t=>t.done).length/tasks.length)*100);

  const urgentDeadlines=[];
  for(const c of CASE_DEFS){
    const f=bondFacts[c.id]||{};
    if(f.noticeMailed){
      const deadline=addDays(f.noticeMailed,185);
      const days=daysUntil(deadline);
      if(f.sjDate||f.sjStatus==='entered') continue;
      if(days!==null&&days<=60) urgentDeadlines.push({county:c.county,caseId:c.id,deadline,days});
    }
  }

  const go=id=>{setPage(id);setMenuOpen(false)};

  const pages={dash:DashPage,timeline:TimelinePage,report:ReportPage,tasks:TasksPage,attorneys:AttorneyPage,cases:CasesPage,contacts:ContactsPage,logbook:LogbookPage,finance:FinancePage};
  const Pg=pages[page]||DashPage;

  if(loading) return(
    <div style={{minHeight:"100vh",background:"#080810",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
      <div className="glow" style={{width:48,height:48,borderRadius:14,background:"linear-gradient(135deg,#4f46e5,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>{"\u{1F6E1}\uFE0F"}</div>
      <div style={{color:"#6b7280",fontSize:14}}>Loading your dashboard\u2026</div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:"#080810",color:"#e2e8f0",fontFamily:"'DM Sans','Segoe UI',sans-serif",display:"flex",flexDirection:"column"}}>
      {/* HEADER */}
      <header style={{background:"rgba(8,8,16,0.98)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"0 16px",height:56,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:200,backdropFilter:"blur(12px)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:32,height:32,borderRadius:9,background:"linear-gradient(135deg,#4f46e5,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,flexShrink:0}}>{"\u{1F6E1}\uFE0F"}</div>
          <div>
            <div style={{fontWeight:800,fontSize:14,color:"#e0e7ff"}}>Meish's Defense Dashboard</div>
            <div style={{fontSize:10,color:"#374151",letterSpacing:"0.04em"}}>JOVONTAE \u00B7 $575K \u00B7 4 COUNTIES</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <SyncBadge syncing={syncing} lastSync={lastSync}/>
          {(p0open.length>0||urgentDeadlines.length>0)&&(
            <div className="pulse" style={{background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:20,padding:"4px 10px",fontSize:11,color:"#fca5a5",fontWeight:700}}>
              {p0open.length+urgentDeadlines.length} urgent
            </div>
          )}
          <button onClick={()=>setMenuOpen(v=>!v)} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,color:"#94a3b8",cursor:"pointer",padding:"6px 10px",fontSize:18,lineHeight:1}}>{"\u2630"}</button>
        </div>
      </header>

      {/* SLIDE-OUT MENU */}
      {menuOpen&&(
        <div style={{position:"fixed",inset:0,zIndex:300,display:"flex"}}>
          <div onClick={()=>setMenuOpen(false)} style={{flex:1,background:"rgba(0,0,0,0.7)"}}/>
          <div style={{width:240,background:"#0d0d1a",borderLeft:"1px solid rgba(255,255,255,0.08)",padding:"20px 12px",display:"flex",flexDirection:"column",gap:4,overflowY:"auto"}}>
            <div style={{fontWeight:800,color:"#6366f1",fontSize:11,padding:"0 8px 12px",letterSpacing:"0.1em",textTransform:"uppercase",borderBottom:"1px solid rgba(255,255,255,0.06)",marginBottom:8}}>Navigation</div>
            {NAV.map(n=>(
              <button key={n.id} onClick={()=>go(n.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:9,border:"none",cursor:"pointer",background:page===n.id?"rgba(99,102,241,0.18)":"transparent",color:page===n.id?"#a5b4fc":"#6b7280",fontWeight:page===n.id?700:400,fontSize:14,textAlign:"left"}}>
                <span>{n.icon}</span>{n.label}
              </button>
            ))}
            <Divider/>
            <div style={{fontSize:11,color:"#374151",padding:"4px 12px"}}>
              Storage: {useD1?<span style={{color:"#4ade80"}}>Cloud (D1)</span>:<span style={{color:"#fbbf24"}}>Local only</span>}
            </div>
          </div>
        </div>
      )}

      {/* BOTTOM TAB BAR */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"rgba(8,8,16,0.97)",borderTop:"1px solid rgba(255,255,255,0.07)",display:"flex",zIndex:150,backdropFilter:"blur(12px)"}}>
        {NAV.slice(0,6).map(n=>(
          <button key={n.id} onClick={()=>go(n.id)} style={{flex:1,padding:"10px 2px 8px",border:"none",background:"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontSize:16,opacity:page===n.id?1:0.4}}>{n.icon}</span>
            <span style={{fontSize:8,color:page===n.id?"#a5b4fc":"#4b5563",fontWeight:page===n.id?700:400}}>{n.label}</span>
            {page===n.id&&<div style={{width:16,height:2,background:"#6366f1",borderRadius:99}}/>}
          </button>
        ))}
        <button onClick={()=>setMenuOpen(true)} style={{flex:1,padding:"10px 2px 8px",border:"none",background:"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <span style={{fontSize:16,opacity:0.4}}>{"\u22EF"}</span>
          <span style={{fontSize:8,color:"#4b5563"}}>More</span>
        </button>
      </div>

      {/* MAIN CONTENT */}
      <main style={{flex:1,overflowY:"auto",paddingBottom:88}}>
        <Pg tasks={tasks} p0open={p0open} donePct={donePct} urgentDeadlines={urgentDeadlines}
          contacts={contacts} setContacts={setContacts}
          bondFacts={bondFacts} setBondFacts={setBondFacts}
          logs={logs} addLog={addLog} delLog={delLog}
          ledger={ledger} addLedger={addLedger} delLedger={delLedger}
          attorneys={attorneys} saveAttorney={saveAttorney} delAttorney={delAttorney}
          taskChecks={taskChecks} toggleTask={toggleTask} toggleCheck={toggleCheck}
          reportSec={reportSec} setReportSec={setReportSec}
          setPage={setPage}/>
      </main>
    </div>
  );
}

function DashPage({p0open,donePct,tasks,urgentDeadlines,setPage,bondFacts}){
  const filledCount=CASE_DEFS.filter(c=>{const f=bondFacts[c.id]||{};return f.noticeMailed||f.forfeitureDate||f.sjStatus}).length;
  return(
    <div className="fade" style={{padding:"24px 18px",maxWidth:700,margin:"0 auto"}}>
      <div style={{marginBottom:24}}>
        <div style={{fontSize:11,color:"#4b5563",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:4}}>Defense Overview</div>
        <h1 style={{fontSize:24,fontWeight:800,color:"#f1f5f9",letterSpacing:"-0.02em",lineHeight:1.2}}>One step at a time.</h1>
        <p style={{color:"#6b7280",fontSize:14,marginTop:6}}>Everything saves automatically. Any device, any time.</p>
      </div>

      {urgentDeadlines.map(d=>(
        <Card key={d.caseId} danger style={{marginBottom:12}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span className="pulse" style={{fontSize:18}}>{"\u23F0"}</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:800,color:"#fca5a5",fontSize:13}}>{d.county} \u2014 185-Day Window Closing</div>
              <div style={{color:"#6b7280",fontSize:12,marginTop:2}}>Deadline: {fmtDate(d.deadline)} \u00B7 <strong style={{color:d.days<=14?"#f87171":d.days<=30?"#fbbf24":"#94a3b8"}}>{d.days} days left</strong></div>
            </div>
            <Btn onClick={()=>setPage("timeline")} variant="danger" style={{fontSize:11,padding:"5px 10px"}}>Timeline \u2192</Btn>
          </div>
        </Card>
      ))}

      {p0open.length>0&&(

/* ═══════════════════════════════════════════════════════════════════
   BOND TIMELINE — 185-day deadline calculator
═══════════════════════════════════════════════════════════════════ */
function TimelinePage({bondFacts,setBondFacts,setPage}){
  const[editing,setEditing]=useState(null);
  const saveField=(caseId,field,value)=>{setBondFacts(p=>({...p,[caseId]:{...(p[caseId]||{}),[field]:value}}))};

  const BondCard=({c})=>{
    const f=bondFacts[c.id]||{};
    const isEd=editing===c.id;
    const deadline185=f.noticeMailed?addDays(f.noticeMailed,185):null;
    const daysLeft=deadline185?daysUntil(deadline185):null;
    const sjEntered=f.sjStatus==='entered';
    let statusLabel="UNKNOWN",statusColor="#6b7280";
    if(sjEntered){statusLabel="SJ ENTERED \u2014 CRITICAL";statusColor="#f87171"}
    else if(f.noticeMailed&&daysLeft!==null){
      if(daysLeft<0){statusLabel="WINDOW EXPIRED \u2014 VERIFY";statusColor="#f87171"}
      else if(daysLeft<=14){statusLabel=daysLeft+"d LEFT \u2014 URGENT";statusColor="#f87171"}
      else if(daysLeft<=30){statusLabel=daysLeft+"d LEFT \u2014 WATCH";statusColor="#fbbf24"}
      else{statusLabel=daysLeft+"d LEFT \u2014 ACTIVE";statusColor="#4ade80"}
    } else if(f.forfeitureDate){statusLabel="FORFEITED \u2014 NOTICE UNKNOWN";statusColor="#fbbf24"}

    return(
      <Card style={{marginBottom:12,borderColor:isEd?"rgba(99,102,241,0.4)":undefined}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{width:10,height:10,borderRadius:"50%",background:c.color,flexShrink:0}}/>
            <div><div style={{fontWeight:800,color:"#f1f5f9",fontSize:15}}>{c.county}</div><div style={{color:"#6b7280",fontSize:11}}>{fmt(c.bond)}</div></div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <Pill label={statusLabel} color={statusColor}/>
            <button onClick={()=>setEditing(isEd?null:c.id)} style={{background:"transparent",border:"1px solid rgba(255,255,255,0.1)",borderRadius:6,color:"#6b7280",cursor:"pointer",padding:"4px 8px",fontSize:12}}>{isEd?"Done":"Edit"}</button>
          </div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginBottom:10}}>
          {[{label:"FTA Date",key:"ftaDate",hint:"Nov 26 2025"},{label:"Forfeiture Declared",key:"forfeitureDate",hint:"In court minutes"},{label:"Notice Mailed",key:"noticeMailed",hint:"CRITICAL \u2014 starts clock"},{label:"Summary Judgment",key:"sjDate",hint:"If entered"}].map(field=>(
            <div key={field.key} style={{background:"rgba(0,0,0,0.3)",borderRadius:8,padding:"10px 12px",border:"1px solid "+(f[field.key]?"rgba(99,102,241,0.3)":"rgba(255,255,255,0.05)")}}>
              <div style={{fontSize:10,color:f[field.key]?"#818cf8":"#4b5563",fontWeight:700,textTransform:"uppercase",marginBottom:4}}>{field.label}</div>
              {isEd?<input type="date" value={f[field.key]||""} onChange={e=>saveField(c.id,field.key,e.target.value)} style={{width:"100%",background:"transparent",border:"none",color:"#e2e8f0",fontSize:12,padding:0,outline:"none"}}/>:
              <div style={{color:f[field.key]?"#e2e8f0":"#374151",fontSize:12,fontWeight:f[field.key]?600:400}}>{f[field.key]?fmtDate(f[field.key]):<span style={{color:"#374151"}}>{field.hint}</span>}</div>}
            </div>
          ))}
        </div>

        {f.noticeMailed&&(
          <div style={{background:sjEntered?"rgba(239,68,68,0.07)":daysLeft!==null&&daysLeft<=30?"rgba(251,191,36,0.06)":"rgba(74,222,128,0.05)",border:"1px solid "+(sjEntered?"rgba(239,68,68,0.2)":daysLeft!==null&&daysLeft<=30?"rgba(251,191,36,0.2)":"rgba(74,222,128,0.15)"),borderRadius:8,padding:"10px 14px",marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",marginBottom:3}}>185-Day Deadline (PC 1305)</div>
                <div style={{fontSize:14,fontWeight:800,color:sjEntered?"#f87171":daysLeft!==null&&daysLeft<=14?"#f87171":daysLeft!==null&&daysLeft<=30?"#fbbf24":"#4ade80"}}>
                  {fmtDate(deadline185)} {daysLeft!==null&&!sjEntered&&(" \u00B7 "+(daysLeft>=0?daysLeft+" days remaining":"EXPIRED"))}
                  {sjEntered&&" \u00B7 Summary Judgment Already Entered"}
                </div>
              </div>
              {daysLeft!==null&&daysLeft>=0&&!sjEntered&&(
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:28,fontWeight:800,color:daysLeft<=14?"#f87171":daysLeft<=30?"#fbbf24":"#4ade80",lineHeight:1}}>{daysLeft}</div>
                  <div style={{fontSize:10,color:"#6b7280"}}>days left</div>
                </div>
              )}
            </div>
          </div>
        )}

        {isEd&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:8}}>
            <div>
              <label style={{fontSize:11,color:"#6b7280",display:"block",marginBottom:3}}>Summary Judgment Status</label>
              <select value={f.sjStatus||""} onChange={e=>saveField(c.id,'sjStatus',e.target.value)} style={{width:"100%",padding:"7px 10px",borderRadius:7,border:"1px solid rgba(255,255,255,0.1)",background:"#0d0d1a",color:"#e2e8f0",fontSize:13}}>
                <option value="">Unknown</option>
                <option value="not_entered">Not Yet Entered</option>
                <option value="entered">Entered \u2014 CRITICAL</option>
                <option value="vacated">Vacated / Set Aside</option>
              </select>
            </div>
            <div>
              <label style={{fontSize:11,color:"#6b7280",display:"block",marginBottom:3}}>Confirmed Case Number</label>
              <input value={f.caseNum||""} onChange={e=>saveField(c.id,'caseNum',e.target.value)} placeholder={c.caseNum} style={{width:"100%",padding:"7px 10px",borderRadius:7,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.04)",color:"#e2e8f0",fontSize:13}}/>
            </div>
          </div>
        )}

        {isEd&&(
          <div style={{marginTop:8}}>
            <label style={{fontSize:11,color:"#6b7280",display:"block",marginBottom:3}}>Notes from court call</label>
            <textarea value={f.notes||""} onChange={e=>saveField(c.id,'notes',e.target.value)} placeholder="Who you spoke with, what they confirmed, what was unclear" rows={3} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.04)",color:"#e2e8f0",fontSize:13,resize:"vertical"}}/>
          </div>
        )}
        {!isEd&&f.notes&&<div style={{fontSize:12,color:"#6b7280",borderTop:"1px solid rgba(255,255,255,0.06)",paddingTop:8,marginTop:4,lineHeight:1.5}}>{f.notes}</div>}
      </Card>
    );
  };

  return(
    <div className="fade" style={{padding:"24px 18px",maxWidth:700,margin:"0 auto"}}>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:11,color:"#4b5563",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:4}}>The Most Important Page</div>
        <h2 style={{fontSize:22,fontWeight:800,color:"#f1f5f9"}}>Bond Timeline</h2>
        <p style={{color:"#6b7280",fontSize:13,marginTop:6}}>Fill in dates as you learn them from each court call. The 185-day deadline calculator updates automatically.</p>
      </div>
      <Card style={{borderColor:"rgba(251,191,36,0.25)",background:"rgba(251,191,36,0.04)",marginBottom:18}}>
        <div style={{fontWeight:800,color:"#fcd34d",fontSize:13}}>{"\u{1F4CD}"} How to use this page</div>
        <div style={{color:"#6b7280",fontSize:12,marginTop:5,lineHeight:1.6}}>After each court call, tap <strong style={{color:"#e2e8f0"}}>Edit</strong> on the matching bond and fill in the dates the clerk gives you. The moment you enter the Notice Mailed date, the 185-day deadline appears automatically. This is the window you must protect.</div>
      </Card>
      {CASE_DEFS.map(c=><BondCard key={c.id} c={c}/>)}
      <Card style={{marginTop:8,background:"rgba(239,68,68,0.04)",borderColor:"rgba(239,68,68,0.2)"}}>
        <div style={{fontWeight:700,color:"#fca5a5",fontSize:13,marginBottom:4}}>{"\u26A0"} If Summary Judgment has already been entered</div>
        <div style={{color:"#6b7280",fontSize:12,lineHeight:1.6}}>Mark that bond's SJ status as "Entered \u2014 CRITICAL" and immediately move to contacting a California bail forfeiture attorney. SJ means the court has ruled against the surety \u2014 but there may still be options. Time is critical.</div>
      </Card>
    </div>
  );
}

function ReportPage({reportSec,setReportSec}){
  if(reportSec){
    const s=REPORT.find(r=>r.id===reportSec);
    const idx=REPORT.findIndex(r=>r.id===reportSec);
    return(
      <div className="fade" style={{padding:"24px 18px",maxWidth:700,margin:"0 auto"}}>
        <button onClick={()=>setReportSec(null)} style={{background:"transparent",border:"none",color:"#6b7280",cursor:"pointer",marginBottom:16,fontSize:13,display:"flex",alignItems:"center",gap:4}}>{"\u2190"} Back to Report</button>
        <div style={{fontSize:28,marginBottom:8}}>{s.icon}</div>
        <div style={{fontSize:10,color:"#6366f1",fontWeight:800,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:4}}>Section {idx+1} of {REPORT.length}</div>
        <h2 style={{fontSize:20,fontWeight:800,color:"#f1f5f9",marginBottom:20}}>{s.title}</h2>
        <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:12,padding:"22px 20px"}}>
          {s.body.split("\n").map((line,i)=>{
            if(!line.trim()) return <div key={i} style={{height:8}}/>;
            if(line.startsWith("\u2022")) return <div key={i} style={{display:"flex",gap:8,marginBottom:6}}><span style={{color:"#6366f1",flexShrink:0}}>{"\u2022"}</span><span style={{color:"#94a3b8",fontSize:14,lineHeight:1.7}}>{line.slice(1).trim()}</span></div>;
            if(/^Step \d/.test(line)||/^(FIRST|SECOND|THIRD|FOURTH|FIFTH|SIXTH|DO:|DON\u2019T:)/.test(line)||/^Item \d/.test(line)) return <div key={i} style={{fontWeight:700,color:"#c7d2fe",fontSize:13,marginTop:14,marginBottom:6}}>{line}</div>;
            if(/^\d\)/.test(line)) return <div key={i} style={{display:"flex",gap:8,marginBottom:6}}><span style={{color:"#818cf8",flexShrink:0,fontWeight:700,fontSize:13}}>{line.split(")")[0]})</span><span style={{color:"#94a3b8",fontSize:14,lineHeight:1.7}}>{line.slice(line.indexOf(")")+1).trim()}</span></div>;
            return <p key={i} style={{color:"#94a3b8",lineHeight:1.75,fontSize:14,marginBottom:2}}>{line}</p>;
          })}
        </div>
        <div style={{display:"flex",gap:8,marginTop:16}}>
          {idx>0&&<Btn onClick={()=>setReportSec(REPORT[idx-1].id)} variant="ghost">{"\u2190"} Prev</Btn>}
          {idx<REPORT.length-1&&<Btn onClick={()=>setReportSec(REPORT[idx+1].id)}>Next {"\u2192"}</Btn>}
        </div>
      </div>
    );
  }
  return(
    <div className="fade" style={{padding:"24px 18px",maxWidth:700,margin:"0 auto"}}>
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:22,fontWeight:800,color:"#f1f5f9"}}>Full Report</h2>
        <p style={{color:"#6b7280",fontSize:13,marginTop:6}}>Everything in plain English. Tap any section to read it.</p>
      </div>
      <Card style={{borderColor:"rgba(251,191,36,0.25)",background:"rgba(251,191,36,0.04)",marginBottom:18}}>
        <div style={{fontWeight:800,color:"#fcd34d",fontSize:13}}>{"\u{1F4A1}"} Start with Section 3 if you have 5 minutes.</div>
        <div style={{color:"#6b7280",fontSize:12,marginTop:4,lineHeight:1.5}}>It explains what must legally happen before you owe $575,000.</div>
      </Card>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {REPORT.map((s,i)=>(
          <Card key={s.id} onClick={()=>setReportSec(s.id)} style={{cursor:"pointer"}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:36,height:36,borderRadius:9,background:"rgba(99,102,241,0.12)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{s.icon}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:10,color:"#6366f1",fontWeight:800,textTransform:"uppercase"}}>Section {i+1}</div>
                <div style={{fontWeight:700,color:"#e2e8f0",fontSize:14,marginTop:1}}>{s.title}</div>
              </div>
              <span style={{color:"#374151"}}>{"\u203A"}</span>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

                  <div style={{fontSize:11,fontWeight:800,color:"#818cf8",textTransform:"uppercase"}}>{"\u{1F4DE}"} Call Script</div>

function FinancePage({ledger,addLedger,delLedger}){
  const[show,setShow]=useState(false);
  const[form,setForm]=useState({type:"OTHER",amount:"",note:""});
  const add=async()=>{if(!form.amount)return;await addLedger({...form,amount:parseFloat(form.amount)});setForm({type:"OTHER",amount:"",note:""});setShow(false)};
  const tc={CLAIMED:"#f87171",PREMIUM:"#fbbf24",PAID:"#4ade80",SETTLEMENT_OFFER_RECEIVED:"#818cf8",SETTLEMENT_OFFER_SENT:"#60a5fa",LEGAL_FEES:"#c084fc",RECOVERY_COSTS:"#f97316",OTHER:"#9ca3af"};
  return(
    <div className="fade" style={{padding:"24px 18px",maxWidth:700,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div><h2 style={{fontSize:20,fontWeight:800,color:"#f1f5f9"}}>Finances</h2><p style={{color:"#6b7280",fontSize:13,marginTop:4}}>Track every number. Sign nothing without knowing court status.</p></div>
        <Btn onClick={()=>setShow(v=>!v)} style={{fontSize:12,padding:"8px 14px"}}>+ Add</Btn>
      </div>
      <Card style={{borderColor:"rgba(251,191,36,0.3)",background:"rgba(251,191,36,0.04)",marginBottom:16}}>
        <div style={{fontWeight:800,color:"#fcd34d",fontSize:13}}>{"\u26A0"} Do not sign any payment plan or settlement until you confirm Summary Judgment status in each county.</div>
      </Card>
      {show&&(
        <Card style={{marginBottom:14,borderColor:"rgba(99,102,241,0.3)"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div><label style={{fontSize:11,color:"#6b7280",display:"block",marginBottom:3}}>Type</label><select value={form.type} onChange={e=>setForm(p=>({...p,type:e.target.value}))} style={{width:"100%",padding:"7px 10px",borderRadius:7,border:"1px solid rgba(255,255,255,0.1)",background:"#0d0d1a",color:"#e2e8f0",fontSize:13}}>{["CLAIMED","PREMIUM","PAID","SETTLEMENT_OFFER_RECEIVED","SETTLEMENT_OFFER_SENT","LEGAL_FEES","RECOVERY_COSTS","OTHER"].map(t=><option key={t}>{t}</option>)}</select></div>
            <div><label style={{fontSize:11,color:"#6b7280",display:"block",marginBottom:3}}>Amount ($)</label><input type="number" value={form.amount} onChange={e=>setForm(p=>({...p,amount:e.target.value}))} style={{width:"100%",padding:"7px 10px",borderRadius:7,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.04)",color:"#e2e8f0",fontSize:13}}/></div>
          </div>
          <div style={{marginBottom:10}}><label style={{fontSize:11,color:"#6b7280",display:"block",marginBottom:3}}>Source / Notes</label><input value={form.note} onChange={e=>setForm(p=>({...p,note:e.target.value}))} placeholder="Who made this claim? What date?" style={{width:"100%",padding:"7px 10px",borderRadius:7,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.04)",color:"#e2e8f0",fontSize:13}}/></div>
          <div style={{display:"flex",gap:8}}><Btn onClick={add} style={{fontSize:12}}>Save</Btn><Btn variant="ghost" onClick={()=>setShow(false)} style={{fontSize:12}}>Cancel</Btn></div>
        </Card>
      )}
      {ledger.map(e=>(
        <Card key={e.id} style={{marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <Pill label={e.type} color={tc[e.type]||"#9ca3af"}/>
              <div style={{color:"#94a3b8",fontSize:13,marginTop:7,lineHeight:1.5}}>{e.note}</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginLeft:14}}>
              <div style={{fontWeight:800,fontSize:17,color:tc[e.type]||"#e2e8f0",flexShrink:0}}>{fmt(e.amount)}</div>
              <button onClick={()=>delLedger(e.id)} style={{background:"transparent",border:"none",color:"#374151",cursor:"pointer",fontSize:14,padding:"4px"}}>{"\u00D7"}</button>
            </div>
          </div>
        </Card>
      ))}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════════════════ */
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
